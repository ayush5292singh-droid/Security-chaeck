<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER TERMINAL</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="terminal">
    <div class="topbar">
      <span>●</span><span>●</span><span>●</span>
      <b> CYBER SECURITY TERMINAL</b>
    </div>

    <div id="screen">
      <div class="green">CYBER TERMINAL v1.0</div>
      <div>Authorized security testing environment</div>
      <br>
      <div>Type <b>help</b> to see available commands.</div>
      <br>
    </div>

    <div class="inputLine">
      <span class="prompt">root@cyber:~$</span>
      <input id="command" autocomplete="off" autofocus>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
